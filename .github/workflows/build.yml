name: Compilar APK

# Se puede lanzar a mano desde la pestaña Actions, y corre solo en cada cambio.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write          # necesario para publicar la versión descargable

jobs:
  build:
    runs-on: ubuntu-latest          # esta máquina ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # La clave de firma vive en los secretos del repositorio (Settings → Secrets → Actions):
      # JHAKET_KEYSTORE_B64 (la clave en base64) y JHAKET_KEYSTORE_PASS (su contraseña).
      - name: Preparar la clave de firma
        env:
          CLAVE: ${{ secrets.JHAKET_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLAVE" ]; then
            echo "$CLAVE" | base64 -d > "$RUNNER_TEMP/jhaket.jks"
            echo "JHAKET_KEYSTORE_FILE=$RUNNER_TEMP/jhaket.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave propia de JhaKet."
          else
            echo "No hay clave propia cargada: se firma con la de depuración."
          fi

      - name: Compilar
        env:
          JHAKET_KEYSTORE_PASS: ${{ secrets.JHAKET_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Preparar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/*.apk salida/JhaKet-IPTV.apk
          ls -lh salida/

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: JhaKet-IPTV-apk
          path: salida/JhaKet-IPTV.apk
          if-no-files-found: error

      # Deja el .apk con descarga directa, sin tener que descomprimir nada en el teléfono.
      - name: Publicar versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" salida/JhaKet-IPTV.apk \
            --title "JhaKet IPTV v${{ github.run_number }}" \
            --notes "APK para teléfono Android, Android TV y Google TV. Se instala habilitando orígenes desconocidos."
