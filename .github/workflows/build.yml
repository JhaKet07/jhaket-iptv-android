name: Compilar APK

# Se puede lanzar a mano desde la pestaña Actions, y corre solo en cada cambio.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest          # esta máquina ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: JhaKet-IPTV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
