<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>JhaKet IPTV</title>
<style>
  html,body{height:100%;margin:0;background:#07080c;color:#8e97aa;font:500 14px/1.4 system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
  .rueda{width:34px;height:34px;border-radius:50%;border:3px solid #2b3243;border-top-color:#ff5a45;animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  button{margin-top:6px;padding:10px 18px;border:0;border-radius:10px;background:#ff5a45;color:#fff;font:600 14px system-ui}
</style>
</head>
<body>
<div class="rueda" id="rueda"></div>
<div id="msg">Cargando JhaKet…</div>
<script>
/* Cargador de JhaKet IPTV.
   Baja la versión actual de la app desde el servidor y la ejecuta. Se guarda una copia:
   si no hay internet o el servidor tarda, se abre la última que funcionó. */
(function () {
  var URL_APP = 'https://jhaketiptv.floot.app/_api/ext/app';
  var CLAVE = 'jk:app-html';
  var hecho = false;
  var copia = null;
  try { copia = localStorage.getItem(CLAVE); } catch (e) {}

  function correr(html) {
    if (hecho) return;
    hecho = true;
    document.open();
    document.write(html);
    document.close();
  }
  function sinConexion() {
    if (hecho) return;
    document.getElementById('rueda').style.display = 'none';
    document.getElementById('msg').textContent = 'No se pudo conectar con JhaKet. Revisá tu conexión a internet.';
    var b = document.createElement('button');
    b.textContent = 'Reintentar';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
  }

  /* Con copia guardada no se hace esperar más de 6 segundos. */
  var espera = setTimeout(function () { if (copia) correr(copia); }, 6000);

  fetch(URL_APP, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      if (!/<html[\s>]/i.test(html)) throw new Error('respuesta rara');
      try { localStorage.setItem(CLAVE, html); } catch (e) {}
      clearTimeout(espera);
      correr(html);
    })
    .catch(function () {
      clearTimeout(espera);
      if (copia) correr(copia); else sinConexion();
    });
})();
</script>
</body>
</html>
